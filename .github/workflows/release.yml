name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_windows:
        description: Skip the Windows job
        type: boolean
        default: false
      skip_macos:
        description: Skip both macOS jobs
        type: boolean
        default: false
      skip_android:
        description: Skip the Android job
        type: boolean
        default: false
      skip_ios:
        description: Skip the iOS job
        type: boolean
        default: false

# Prevent duplicate workflow runs for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 部署常量在构建期由 build.rs 注入（见 src-tauri/build.rs）。仓库里只有占位值，
# 真实值存在仓库 secret 里。不提供这四项，发布的包会指向占位地址、无法激活。
#
# 两条注入路径同时保留：工作流 env 管桌面平台，qza-config 动作写出的
# src-tauri/qza.config.local.json 管 iOS —— `tauri ios build` 把 Rust 编译交给
# Xcode，环境被裁剪，env 到不了 build.rs。构建后由 qza-verify（以及 iOS 那步
# 额外的开袋检查）核对真实产物，避免又安静地发布一批废包。
env:
  QZA_LICENSE_SERVER: ${{ secrets.QZA_LICENSE_SERVER }}
  QZA_LICENSE_PUBLIC_KEY: ${{ secrets.QZA_LICENSE_PUBLIC_KEY }}
  QZA_UPDATE_ENDPOINT: ${{ secrets.QZA_UPDATE_ENDPOINT }}
  QZA_DOWNLOAD_PAGE: ${{ secrets.QZA_DOWNLOAD_PAGE }}
  QZA_REQUIRE_CONFIG: "1"

jobs:
  # Windows
  windows:
    runs-on: windows-latest
    if: ${{ ! inputs.skip_windows }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: "false"

      - name: Install frontend dependencies
        run: npm ci

      - uses: ./.github/actions/qza-config

      - name: Build Windows
        run: npx tauri build --bundles nsis

      - uses: ./.github/actions/qza-verify

      - name: Show Windows artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem `
            -Path "src-tauri/target/release/bundle" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
          ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # macOS x64
  macos-x64:
    runs-on: macos-latest
    if: ${{ ! inputs.skip_macos }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: "false"
          # 与 ci-build.yml 的 macos 任务共用同一份缓存。两个工作流的 job id 不同
          # （macos vs macos-x64），所以必须用 shared-key 取代默认的 job 键。
          shared-key: x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - uses: ./.github/actions/qza-config

      - name: Build macOS x64
        run: npx tauri build --target x86_64-apple-darwin --bundles dmg

      - uses: ./.github/actions/qza-verify

      - name: Show macOS x64 artifacts
        if: always()
        shell: bash
        run: |
          find \
            src-tauri/target/x86_64-apple-darwin/release/bundle \
            -type f \
            -print || true

      - name: Upload macOS x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # macOS ARM64
  macos-arm64:
    runs-on: macos-latest
    if: ${{ ! inputs.skip_macos }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: "false"
          # 与 ci-build.yml 的 macos 任务共用同一份缓存。两个工作流的 job id 不同
          # （macos vs macos-arm64），所以必须用 shared-key 取代默认的 job 键。
          shared-key: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - uses: ./.github/actions/qza-config

      - name: Build macOS ARM64
        run: npx tauri build --target aarch64-apple-darwin --bundles dmg

      - uses: ./.github/actions/qza-verify

      - name: Show macOS ARM64 artifacts
        if: always()
        shell: bash
        run: |
          find \
            src-tauri/target/aarch64-apple-darwin/release/bundle \
            -type f \
            -print || true

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Android
  android:
    runs-on: ubuntu-latest
    if: ${{ ! inputs.skip_android }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: "false"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973"

          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973"

      - name: Install frontend dependencies
        run: npm ci

      - uses: ./.github/actions/qza-config

      - name: Build Android
        run: npx tauri android build --target aarch64 armv7 --apk

      - name: Verify Android ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          for ABI in arm64-v8a armeabi-v7a; do
            unzip -p "$APK" "lib/$ABI/libqzonearchive_lib.so" > /dev/null
          done
          if unzip -Z1 "$APK" | grep -E '^lib/(x86|x86_64)/' > /dev/null; then
            echo "::error::Release APK must contain ARM and ARM64 only."
            exit 1
          fi

      - uses: ./.github/actions/qza-verify

      - name: Find generated Android artifacts
        if: always()
        shell: bash
        run: |
          find \
            src-tauri/gen/android/app/build/outputs \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: Restore Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::缺少仓库 secret ANDROID_KEYSTORE_BASE64。"
            echo "签名密钥库不进版本控制，必须由 secret 提供（release.jks 的 base64）。"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Sign APK
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK_UNSIGNED="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          APK_SIGNED="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"

          if [ ! -f "$APK_UNSIGNED" ]; then
            echo "Unsigned APK not found: $APK_UNSIGNED"

            find \
              src-tauri/gen/android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK_SIGNED"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error
  ios:
    # iOS builds must run on a macOS runner.
    runs-on: macos-15
    if: ${{ ! inputs.skip_ios }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: "false"

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          xcode-select -p
          rustup target list --installed

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi

          pod --version
          ruby -e 'require "xcodeproj"; puts Xcodeproj::VERSION'

      - name: Install frontend dependencies
        run: npm ci

      - uses: ./.github/actions/qza-config

      - name: Check Tauri CLI
        shell: bash
        run: |
          set -euo pipefail

          npx tauri --version

          if ! npx tauri ios build --help | grep -q -- "--no-sign"; then
            echo "The installed Tauri CLI does not support ios build --no-sign."
            echo "Please update @tauri-apps/cli to version 2.11 or newer."
            exit 1
          fi

      - name: Initialize iOS project
        shell: bash
        run: |
          set -euo pipefail

          # The repo does not commit gen/apple, so generate it in CI.
          rm -rf src-tauri/gen/apple
          npx tauri ios init --ci

      - name: Install custom iOS icons
        shell: bash
        run: |
          set -euo pipefail

          npx tauri icon \
            src-tauri/icons/qzone-archive-icon.png \
            --ios-color "#ffffff"

          APPICONSET="$(
            find src-tauri/gen/apple \
              -type d \
              -name "AppIcon.appiconset" \
              -print \
              -quit
          )"

          if [ -z "$APPICONSET" ] || [ ! -d "$APPICONSET" ]; then
            echo "Generated AppIcon.appiconset was not found."
            exit 1
          fi

          STORE_ICON="$APPICONSET/AppIcon-512@2x.png"
          test -f "$STORE_ICON"

          # ios-color fills transparent source pixels with the selected background.
          # sips hasAlpha only reports whether the PNG has an alpha channel;
          # it does not prove that transparent pixels exist.
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$STORE_ICON"

      - name: Configure iOS metadata and privacy manifest
        shell: bash
        run: |
          set -euo pipefail

          INFO_PLIST="$(
            find src-tauri/gen/apple \
              -type f \
              -name "Info.plist" \
              ! -path "*/LaunchScreen.storyboardc/*" \
              -print \
              -quit
          )"

          if [ -z "$INFO_PLIST" ] || [ ! -f "$INFO_PLIST" ]; then
            echo "Generated application Info.plist was not found."
            exit 1
          fi

          IOS_TARGET_DIR="$(dirname "$INFO_PLIST")"
          PRIVACY_MANIFEST="$IOS_TARGET_DIR/PrivacyInfo.xcprivacy"

          cat > "$PRIVACY_MANIFEST" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>NSPrivacyAccessedAPITypes</key>
              <array>
                <dict>
                  <key>NSPrivacyAccessedAPIType</key>
                  <string>NSPrivacyAccessedAPICategoryFileTimestamp</string>

                  <key>NSPrivacyAccessedAPITypeReasons</key>
                  <array>
                    <string>C617.1</string>
                  </array>
                </dict>
              </array>
            </dict>
          </plist>
          EOF

          plutil -lint "$INFO_PLIST"
          plutil -lint "$PRIVACY_MANIFEST"

          # ios init generates the xcodeproj already; add the manifest to the app
          # target Copy Bundle Resources phase explicitly.
          INFO_PLIST="$INFO_PLIST" PRIVACY_MANIFEST="$PRIVACY_MANIFEST" ruby <<'RUBY'
          require "xcodeproj"

          project_path = Dir["src-tauri/gen/apple/*.xcodeproj"].first
          abort "Generated Xcode project was not found." unless project_path

          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find do |candidate|
            candidate.product_type == "com.apple.product-type.application"
          end
          abort "iOS application target was not found." unless target

          info_plist = File.expand_path(ENV.fetch("INFO_PLIST"))
          privacy_manifest = File.expand_path(ENV.fetch("PRIVACY_MANIFEST"))
          info_ref = project.files.find do |file|
            file.real_path.to_s == info_plist
          end
          abort "Info.plist file reference was not found." unless info_ref

          group = info_ref.parent
          manifest_ref = project.files.find do |file|
            file.real_path.to_s == privacy_manifest
          end
          manifest_ref ||= group.new_file("PrivacyInfo.xcprivacy")

          unless target.resources_build_phase.files_references.include?(manifest_ref)
            target.resources_build_phase.add_file_reference(manifest_ref, true)
          end

          project.save
          RUBY

      - name: Build unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail

          npx tauri ios build \
            --target aarch64 \
            --ci \
            --no-sign \
            --build-number "${{ github.run_number }}"

      - name: Collect unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/ios

          IPA_PATH="$(
            find src-tauri/gen/apple \
              -type f \
              -name "*.ipa" \
              -print \
              -quit
          )"

          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "Unsigned IPA was not generated."

            find src-tauri/gen/apple \
              -type f \
              \( \
                -name "*.ipa" \
                -o -name "*.app" \
                -o -name "*.xcarchive" \
              \) \
              -print || true

            exit 1
          fi

          REF_NAME="${GITHUB_REF_NAME:-manual}"
          SAFE_REF_NAME="${REF_NAME//\//-}"

          OUTPUT_NAME="QzoneArchive-${SAFE_REF_NAME}-ios-arm64-unsigned.ipa"

          cp "$IPA_PATH" "dist/ios/$OUTPUT_NAME"

          echo "Generated IPA:"
          ls -lh "dist/ios/$OUTPUT_NAME"

          shasum -a 256 \
            "dist/ios/$OUTPUT_NAME" \
            > dist/ios/SHA256SUMS-ios.txt

          cat dist/ios/SHA256SUMS-ios.txt

      - name: Verify unsigned iOS IPA contents
        shell: bash
        run: |
          set -euo pipefail

          IPA_PATH="$(find dist/ios -type f -name "*.ipa" -print -quit)"
          VERIFY_DIR="$RUNNER_TEMP/qzonearchive-ios-verify"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$IPA_PATH" "$VERIFY_DIR"

          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name "*.app" -print -quit)"
          INFO_PLIST="$APP_PATH/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO_PLIST")"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO_PLIST")"

          # 期望值从仓库内配置推导：上游把二进制名写死成 qzonearchive，
          # 本项目改名后这类硬编码断言会悄悄失效，所以这里读配置而不是抄字面量。
          EXPECTED_EXECUTABLE="$(node -p 'require("./src-tauri/tauri.ios.conf.json").mainBinaryName')"
          EXPECTED_DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" src-tauri/Info.ios.plist)"

          test -n "$EXPECTED_EXECUTABLE"
          test -n "$EXPECTED_DISPLAY_NAME"
          test "$EXECUTABLE" = "$EXPECTED_EXECUTABLE"
          test "$DISPLAY_NAME" = "$EXPECTED_DISPLAY_NAME"
          test -f "$APP_PATH/$EXECUTABLE"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test -f "$APP_PATH/AppIcon60x60@2x.png"
          grep -a -q "assets/index-" "$APP_PATH/$EXECUTABLE"

          # 部署常量必须真的烤进二进制。iOS 的 Rust 编译在 Xcode 构建阶段里跑，
          # 工作流 env 到不了 build.rs，靠 qza-config 写出的本地配置兜底 ——
          # 少了这层检查，占位配置会安静地变成一包装上也激活不了的 ipa。
          LICENSE_HOST="$(node -p 'new URL(process.env.QZA_LICENSE_SERVER).host')"
          if ! grep -a -qF "$LICENSE_HOST" "$APP_PATH/$EXECUTABLE"; then
            echo "The iOS executable still carries the placeholder deployment config."
            echo "Expected the licence host to appear in $APP_PATH/$EXECUTABLE: $LICENSE_HOST"
            exit 1
          fi

          # Published releases must remain unsigned.
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          if codesign -d "$APP_PATH" >/dev/null 2>&1; then
            echo "Expected an unsigned iOS app, but a code signature was found."
            exit 1
          fi

          echo "Verified unsigned IPA:"
          echo "  executable: $EXECUTABLE"
          echo "  display name: $DISPLAY_NAME"
          echo "  privacy manifest: present"
          echo "  custom icon: present"
          echo "  embedded frontend: present"
          echo "  deployment config: present ($LICENSE_HOST)"
          echo "  code signature: absent"

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: |
            dist/ios/*.ipa
            dist/ios/SHA256SUMS-ios.txt
          if-no-files-found: error

  # GitHub Release
  publish:
    needs:
      - windows
      - macos-x64
      - macos-arm64
      - android
      - ios

    runs-on: ubuntu-latest

    # Manual workflow runs only produce Actions Artifacts;
    # pushing a v* tag creates a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download unsigned iOS artifact
        uses: actions/download-artifact@v7
        with:
          name: ios-unsigned
          path: artifacts/ios-unsigned

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows
          path: artifacts/windows

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-x64
          path: artifacts/macos-x64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64
          path: artifacts/macos-arm64

      - name: Download Android artifact
        uses: actions/download-artifact@v7
        with:
          name: android
          path: artifacts/android



      - name: Normalize release file names
        shell: bash
        run: |
          set -euo pipefail

          # productName 是中文（「拾忆」）时，GitHub 上传 release 资产会把开头的非 ASCII
          # 段整段吃掉：拾忆_1.2.8_x64-setup.exe → _1.2.8_x64-setup.exe。
          # 这里在打包前统一改成 ASCII 前缀，让资产名与 README、发布脚本、SHA256SUMS 一致。
          for f in artifacts/windows/*.exe artifacts/macos-x64/*.dmg artifacts/macos-arm64/*.dmg; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            case "$base" in
              [A-Za-z0-9]*) continue ;;
            esac
            ascii="$(printf '%s' "$base" | sed -E 's/^[^A-Za-z0-9]+//')"
            mv "$f" "$(dirname "$f")/qzone-memory_${ascii}"
            echo "renamed: $base -> qzone-memory_${ascii}"
          done

          find artifacts \
            -type f \
            -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/ios-unsigned/*.ipa
            artifacts/windows/**/*.exe
            artifacts/macos-x64/**/*.dmg
            artifacts/macos-arm64/**/*.dmg
            artifacts/android/**/*.apk
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 拾忆 ${{ github.ref_name }}

            拾忆用于尝试恢复仍有可读取互动记录的已删除说说，并将找到的内容保存到本地。Windows 安装包在交付前先校验文件完整性；恢复任务遇到 QQ 登录失效时提示重新登录并保留断点。

            ### 下载说明

            - Windows：下载 `.exe` 安装程序
            - macOS Apple 芯片：下载文件名含 `aarch64` 的 `.dmg`
            - macOS Intel：下载文件名含 `x64` 的 `.dmg`
            - Android：Android 8.0 及以上，下载包含 ARM / ARM64 的 `.apk`。系统 WebView 需要 111 或以上，过旧时会提示更新网页组件。
            - iOS：提供未签名 `.ipa`，需使用 AltStore、SideStore、Sideloadly、TrollStore 等工具自行签名安装，不能直接安装或提交 App Store

            ### 重要说明

            “恢复已删除内容”依赖 QQ 接口仍保留的点赞、评论、回复或其他互动残留。没有互动痕迹、服务端已彻底清除、无权访问或接口不再返回的内容无法恢复，也不能保证结果完整。请仅归档本人账号或已获授权的数据。

            ### 本版更新

            - Windows 安装包在交付前会导出到下载目录并校验完整性标签与校验和，避免分发无法写入安装目录的文件。
            - Windows 重装与升级直接覆盖安装，不再先调用旧版卸载程序。
            - 恢复过程中 QQ 登录失效时不再被当作读取完成，界面提示重新登录，已保存的记录与读取断点都会保留。

