name: CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

# 部署常量在构建期由 build.rs 注入（见 src-tauri/build.rs）。仓库里只有占位值，
# 真实值存在仓库 secret 里。不提供这四项，打出来的包会指向占位地址、无法激活。
#
# 两条注入路径同时保留，缺一不可：
#   1. 工作流级 env（下面的 env: 块）—— 桌面平台走这条；
#   2. src-tauri/qza.config.local.json（qza-config 动作写出）—— iOS 走这条，
#      因为 `tauri ios build` 把 Rust 编译交给 Xcode，环境被裁剪，env 到不了。
# 构建后由 qza-verify 动作核对 build.rs 的真实产物，避免又安静地打出一批废包。
env:
  QZA_LICENSE_SERVER: ${{ secrets.QZA_LICENSE_SERVER }}
  QZA_LICENSE_PUBLIC_KEY: ${{ secrets.QZA_LICENSE_PUBLIC_KEY }}
  QZA_UPDATE_ENDPOINT: ${{ secrets.QZA_UPDATE_ENDPOINT }}
  QZA_DOWNLOAD_PAGE: ${{ secrets.QZA_DOWNLOAD_PAGE }}
  QZA_REQUIRE_CONFIG: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/qza-config
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: ./.github/actions/qza-verify
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: macos-x64
          - target: aarch64-apple-darwin
            artifact: macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/qza-config
      - run: npm ci
      - run: npx tauri build --target ${{ matrix.target }} --bundles dmg
      - uses: ./.github/actions/qza-verify
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-${{ matrix.artifact }}-${{ github.sha }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 90
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: ./.github/actions/qza-config
      - run: npm ci
      - run: npx tauri android build --target aarch64 armv7 --apk
      - name: Verify Android ABI coverage
        run: |
          set -euo pipefail
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          for abi in arm64-v8a armeabi-v7a; do
            unzip -p "$apk" "lib/$abi/libqzonearchive_lib.so" > /dev/null
          done
          if unzip -Z1 "$apk" | grep -E '^lib/(x86|x86_64)/' > /dev/null; then
            echo "::error::Release APK must contain ARM and ARM64 only."
            exit 1
          fi
      - uses: ./.github/actions/qza-verify
      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::缺少仓库 secret ANDROID_KEYSTORE_BASE64。"
            echo "签名密钥库不进版本控制，必须由 secret 提供（release.jks 的 base64）。"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Sign Android APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          unsigned_apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          signed_apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$signed_apk"
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-android-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error
          retention-days: 90

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: ./.github/actions/qza-config
      - run: npm ci
      - run: npx tauri ios init --ci
      - run: npx tauri ios build --target aarch64 --ci --no-sign
      # iOS 的 Rust 编译在 Xcode 构建阶段里跑，cargo 的输出不会出现在日志里，
      # qza-verify 也只能看到 target 目录的常规位置。所以这里直接开袋检查 ipa。
      - name: Assert the ipa carries the real deployment config
        run: |
          set -euo pipefail
          host="$(node -p 'new URL(process.env.QZA_LICENSE_SERVER).host')"
          ipa="$(find src-tauri/gen/apple -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          binary="$RUNNER_TEMP/ios-binary"
          unzip -p "$ipa" 'Payload/*/qzone-memory' > "$binary"
          test -s "$binary"
          if ! grep -qF "$host" "$binary"; then
            echo "::error::$ipa 里的部署配置是占位值，缺少 $host"
            exit 1
          fi
          echo "deployment config present in the ipa: ${host} (${ipa})"
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-ios-unsigned-${{ github.sha }}
          path: src-tauri/gen/apple/**/*.ipa
          if-no-files-found: error
          retention-days: 90
  publish-nightly:
    needs: [windows, macos, android, ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-windows-${{ github.sha }}
          path: artifacts/windows
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-macos-x64-${{ github.sha }}
          path: artifacts/macos-x64
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-macos-arm64-${{ github.sha }}
          path: artifacts/macos-arm64
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-android-${{ github.sha }}
          path: artifacts/android
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-ios-unsigned-${{ github.sha }}
          path: artifacts/ios-unsigned
      - name: Publish nightly pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p nightly

          copy_artifact() {
            local source_root="$1"
            local pattern="$2"
            local destination="$3"
            local source_path

            source_path="$(find "$source_root" -type f -name "$pattern" -print -quit)"
            if [ -z "$source_path" ]; then
              echo "Artifact not found under $source_root: $pattern" >&2
              exit 1
            fi
            cp "$source_path" "$destination"
          }

          copy_artifact artifacts/windows '*.exe' nightly/QzoneArchive-nightly_x64-setup.exe
          copy_artifact artifacts/macos-x64 '*.dmg' nightly/QzoneArchive-nightly_x64.dmg
          copy_artifact artifacts/macos-arm64 '*.dmg' nightly/QzoneArchive-nightly_aarch64.dmg
          copy_artifact artifacts/android '*.apk' nightly/QzoneArchive-nightly-universal.apk
          copy_artifact artifacts/ios-unsigned '*.ipa' nightly/QzoneArchive-nightly-ios-arm64-unsigned.ipa
          ls -lh nightly
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly CI Build" \
            --notes "最新 main 分支的全平台测试构建（pre-release）。文件名为固定名称，可通过上方下载链接直接获取。" \
            --prerelease 2>/dev/null || true
          gh release upload nightly \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            nightly/*
