[package]
name = "qzonearchive"
version = "1.2.5"
description = "将 QQ 空间动态、照片、视频与互动记录安全归档到本地"
authors = ["suenak <85518392+suenak@users.noreply.github.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qzonearchive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 用它在构建期解析 qza.config.json。与下面的运行时依赖同版本，不引入新 crate。
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
encoding_rs = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
cookie = "0.18"
url = "2"
# 授权校验的纯逻辑，与 Tauri 解耦以便独立单元测试
license-core = { path = "license-core" }
# 设备标识需要真正的操作系统熵源，不能用项目内那种基于毫秒的伪随机
getrandom = "0.2"
# hw_hint 对硬件标识做哈希，避免把原始 MachineGuid 上传到服务端
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Registry"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }
