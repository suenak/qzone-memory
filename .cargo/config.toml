# Compressed APK libraries still need ELF alignment for 16 KB Android devices.
# Applies when Cargo is invoked from either the repository or src-tauri directory.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
